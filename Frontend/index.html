<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Assistant</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-info">
                <i class="fa-solid fa-robot bot-icon"></i>
                <div>
                    <h2>IoT Assistant</h2>
                    <span class="status"><i class="fa-solid fa-circle"></i> Online</span>
                </div>
            </div>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>
        </div>
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">Hi! I'm your IoT Assistant. Ask me anything about IoT and smart devices.</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your message here...">
            <button onclick="sendMessage()" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
